# ─── جست‌وجوی گوگل‌نیوز (RSS) ───
# برای منابعی که RSS عمومی ندارن (رویترز) یا از خارج ایران بسته‌ان (سایت‌های اقتصادی ایران).
# when:3h یعنی فقط ۳ ساعت اخیر.
google_news:
  - {query: "site:reuters.com (Iran OR oil OR Fed OR gold OR Hormuz) when:3h", lang: en, name: "Reuters", kind: news, weight: 1.2}
  - {query: "Iran (sanctions OR talks OR nuclear OR strike OR Hormuz) when:3h", lang: en, name: "Iran (EN)", kind: news, weight: 1.0}
  - {query: "(gold price OR oil prices OR Federal Reserve OR dollar index) when:2h", lang: en, name: "Markets (EN)", kind: macro, weight: 0.9}
  - {query: "(دلار OR طلا OR سکه OR تتر) when:2h", lang: fa, name: "بازار ارز و طلا", kind: econ, weight: 1.0}
  - {query: "site:eghtesadnews.com when:3h",    lang: fa, name: "اقتصادنیوز",    kind: econ, weight: 1.0}
  - {query: "site:donya-e-eqtesad.com when:3h", lang: fa, name: "دنیای اقتصاد",  kind: econ, weight: 1.0}
  - {query: "site:ecoiran.com when:3h",         lang: fa, name: "اکوایران",      kind: econ, weight: 0.9}
  - {query: "(مذاکره OR تحریم OR اسنپ‌بک OR آژانس) ایران when:3h", lang: fa, name: "سیاست خارجی", kind: news, weight: 1.0}
  - {query: "(بانک مرکزی OR بنزین OR کالابرگ OR یارانه OR قیمت خودرو) when:4h", lang: fa, name: "معیشت و سیاست‌گذاری", kind: econ, weight: 0.9}
