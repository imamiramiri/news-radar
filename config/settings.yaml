# ═══════════════════════════════════════════════════════════════
#  تنظیمات «رادار خبر»  —  هر چیزی رو اینجا عوض کنید، از اجرای بعد اعمال میشه
# ═══════════════════════════════════════════════════════════════

channel:
  name: "اکوپلن | Ecoplan"
  signature: "@ecoplanco"        # امضای آخر پست‌ها؛ اگه نمی‌خواید خالی بذارید: ""
  # اولویت‌های محتوایی کانال (فیلتر اول بر اساس همین‌ها امتیاز میده)
  focus: |
    - بازار ارز (دلار آزاد، تتر)، طلا و سکه، خودرو، مسکن، بورس تهران
    - مذاکره، تحریم، تنش نظامی و هر خبر سیاسی که روی انتظارات تورمی و دلار اثر داره
    - معیشت مردم: قیمت کالاهای اساسی، حقوق، یارانه و کالابرگ، بنزین، اجاره، دارو
    - سیاست‌های اقتصادی دولت و بانک مرکزی (نرخ ارز، نرخ سود، بودجه، مالیات)
    - اقتصاد جهانی: فدرال رزرو، تورم و اشتغال آمریکا، نفت، انس طلا، دلار جهانی
    - کریپتو فقط اتفاق‌های بزرگ: حرکت شدید بیت‌کوین، قانون‌گذاری مهم، تتر
  avoid: |
    - ورزش، سلبریتی، حوادث بی‌ربط به اقتصاد و سیاست
    - تبلیغات، فروش سیگنال، پیام‌های تبریک و مناسبتی
    - شایعه‌ی بی‌منبع درباره‌ی افراد

time:
  content_timezone: "Asia/Tehran"   # ساعت مخاطب: بریف صبح/شب و ساعت‌های داخل پیام‌ها
  user_timezone: "Asia/Tehran"      # ساعت خودتون (برای ساعت سکوت). مثلاً Europe/Berlin یا Europe/Amsterdam

models:
  triage: "CLAUDE_6_5_HAIKU"        # غربال سریع و ارزان همه‌ی خبرها
  verify: "CLAUDE_6_5_HAIKU"        # راستی‌آزمایی با جست‌وجوی وب
  writer: "CLAUDE_SONNET_5_5"       # تحلیل و نوشتن پست. برای کیفیت بالاتر: CLAUDE_OPUS_5_5
  brief: "CLAUDE_SONNET_5_5"        # بریف صبح و جمع‌بندی شب
  
filters:
  lookback_hours: 3                 # فقط خبرهای چند ساعت اخیر بررسی میشن
  min_score: 72                     # آستانه‌ی ارسال (۰ تا ۱۰۰). زیادی پیام میاد؟ بیشترش کنید
  breaking_score: 88                # خبر «فوری»؛ در ساعت سکوت هم فرستاده میشه
  max_alerts_per_run: 4             # حداکثر نوتیف در هر اجرا (هر ۳۰ دقیقه)
  daily_alert_cap: 40               # سقف نوتیف خبری در روز
  max_clusters_to_triage: 160
  similarity_threshold: 0.6         # تشخیص یک خبر از چند منبع (۰ تا ۱)

trend:
  enabled: true                     # «ترند»: یک خبر از چند منبع مختلف در زمان کوتاه، جدا از امتیازش
  min_sources: 3                    # حداقل تعداد منبع مختلف
  window_minutes: 60                # ... در این بازه
  stale_minutes: 150                # ترندی که آخرین گزارشش قدیمی‌تر از این باشه فرستاده نمیشه
  similarity: 0.5                   # تشخیص «همون خبر» با تیترهای متفاوت (۰ تا ۱)
  min_shared_words: 3               # حداقل کلمه‌ی کلیدی مشترک بین دو تیتر
  memory_hours: 8                   # خبرهای چند ساعت اخیر یادش می‌مونه
  max_per_run: 3
  max_per_day: 15
  allow_in_quiet_hours: true        # ترند در ساعت سکوت (۱:۳۰ تا ۷) هم بیاد؟ نه: false
  ignore_sources: ["شهرخبر"]        # بازنشرکننده‌ها که نباید منبع مستقل حساب بشن
  aliases: {"ایسنا (سایت)": "ایسنا", "خبرآنلاین (سایت)": "خبرآنلاین", "تجارت‌نیوز (سایت)": "تجارت‌نیوز", "خبرفوری (سایت)": "اخبار فوری"}
  routine_patterns:                 # تیترهای روزمره که هر روز همه می‌نویسن و «ترند» نیستن
    - "قیمت .*امروز"
    - "نرخ .*امروز"
    - "پیش.?بینی قیمت"
    - "بورس امروز"
    - "سهام عدالت"
    - "اوقات شرعی"
    - "^فال "
    - "فوتبال"
    - "فوتسال"
    - "والیبال"
    - "لیگ برتر"
    - "سرمربی"
    - "پرسپولیس"
    
verification:
  enabled: false                     # خبرهای تک‌منبعی مهم با جست‌وجوی وب چک میشن
  min_score: 75
  only_single_source: true
  max_searches: 3
  tool_versions: ["web_search_20260209", "web_search_20250305"]

quiet_hours:
  enabled: true                     # در این بازه فقط خبرهای «فوری» میاد؛ بقیه میرن تو بریف صبح
  start: "01:30"
  end: "07:00"

briefs:
  window_minutes: 75
  morning: {enabled: true, time: "08:00"}   # بریف صبح (ساعت مخاطب)
  evening: {enabled: true, time: "21:30"}   # جمع‌بندی شب

market_alerts:
  enabled: true
  cooldown_minutes: 120             # برای هر دارایی حداکثر یک هشدار در این بازه
  # درصد تغییر نسبت به اجرای قبلی (حدود ۳۰ دقیقه) که هشدار حرکت قیمت می‌سازه
  thresholds_pct:
    usdt_irt: 1.5
    gold_ounce: 1.0
    brent: 2.0
    btc: 3.0
    dxy: 0.6

calendar:
  enabled: true                     # تقویم اقتصادی (ForexFactory)
  currencies: ["USD"]
  impacts: ["High"]
  heads_up_minutes: 60              # یادآوری قبل از انتشار داده‌های مهم

telegram:
  send_ready_post_separately: true  # متن آماده‌ی انتشار به‌صورت پیام جدا (راحت کپی/فوروارد کنید)
  send_errors: true                 # اگه API چند بار پشت سر هم خطا داد خبرتون کنه

# قیمت‌ها برای تخمین هزینه (دلار به ازای یک میلیون توکن: [ورودی، خروجی])
pricing_usd_per_mtok:
  CLAUDE_6_5_HAIKU: [0.10, 0.50]
  CLAUDE_SONNET_5_5: [2.00, 10.00]
  CLAUDE_OPUS_5_5: [4.00, 20.00]
web_search_usd_per_1k: 10


